# 常驻 API + 一次性验证。
#   启动 API:        docker compose up -d api        （API_PORT=9000 可改宿主端口）
#   跑测试+冒烟:     docker compose run --rm verify  （自动起 api，跑完即退出）
services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    command: ["sh", "-c", "python -m pytest && python scripts/smoke.py"]
